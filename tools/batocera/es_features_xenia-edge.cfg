    <feature name="LANGUAGE" value="xenia_language" description="Change the game's language.">
      <choice name="English (Default)" value="1" />
      <choice name="Japanese" value="2" />
      <choice name="German" value="3" />
      <choice name="French" value="4" />
      <choice name="Spanish" value="5" />
      <choice name="Italian" value="6" />
      <choice name="Korean" value="7" />
      <choice name="Chinese" value="8" />
      <choice name="Portuguese" value="9" />
      <choice name="Polish" value="11" />
      <choice name="Russian" value="12" />
      <choice name="Swedish" value="13" />
      <choice name="Turkish" value="14" />
      <choice name="Norwegian" value="15" />
      <choice name="Dutch" value="16" />
    </feature>
    <feature name="GAME PATCHES" value="xenia_patches" description="Enable or disable Xenia patches. These patches can fix graphics problems in some games.">
      <choice name="Disabled" value="False" />
      <choice name="Enabled (Default)" value="True" />
    </feature>
    <feature name="RENDER TARGET PATH" group="ADVANCED OPTIONS" value="xenia_edge_render_target_path" description="Performance uses the GPU's own render targets. Accuracy emulates them in shaders: slower, but can fix rendering issues.">
      <choice name="Performance (Default)" value="performance" />
      <choice name="Accuracy" value="accuracy" />
    </feature>
    <feature name="OCCLUSION QUERY" group="ADVANCED OPTIONS" value="xenia_edge_occlusion_query" description="How occlusion queries (lens flares, culling, auto exposure) are answered. Strict is the most accurate and a little slower.">
      <choice name="Fake" value="fake" />
      <choice name="Fast (Default)" value="fast" />
      <choice name="Fast, alternate" value="fast-alt" />
      <choice name="Strict" value="strict" />
    </feature>
    <feature name="CLEAR MEMORY PAGE STATE" group="ADVANCED OPTIONS" value="xenia_page_state" description="Refresh state of memory pages to enable gpu written data. (Use for 'Team Ninja' Games to fix missing character models).">
      <choice name="Disabled" value="False" />
      <choice name="Enabled" value="True" />
    </feature>
    <feature name="HARD TEXTURE CACHE MEMORY LIMIT" group="ADVANCED OPTIONS" value="xenia_limit_hard" description="Maximum host texture memory usage (in megabytes) above which textures will be destroyed as soon as possible.">
      <choice name="768MB (Default)" value="768" />
      <choice name="1536MB" value="1536" />
      <choice name="2304MB" value="2304" />
      <choice name="3072MB" value="3072" />
      <choice name="3840MB" value="3840" />
      <choice name="4096MB" value="4096" />
      <choice name="5120MB" value="5120" />
      <choice name="6144MB" value="6144" />
    </feature>
    <feature name="TEXTURE MEMORY SCALE SIZE" group="ADVANCED OPTIONS" value="xenia_limit_render_to_texture" description="Part of the host texture memory budget (in megabytes) that will be scaled by the current drawing resolution scale.">
      <choice name="24MB (Default)" value="24" />
      <choice name="48MB" value="48" />
      <choice name="72MB" value="72" />
      <choice name="96MB" value="96" />
    </feature>
    <feature name="SOFT TEXTURE CACHE MEMORY LIMIT" group="ADVANCED OPTIONS" value="xenia_limit_soft" description="Maximum host texture memory usage (in megabytes) above which old textures will be destroyed. Set below hard limit.">
      <choice name="384MB (Default)" value="384" />
      <choice name="768MB" value="768" />
      <choice name="1536MB" value="1536" />
      <choice name="2048MB" value="2048" />
      <choice name="3072MB" value="3072" />
      <choice name="4096MB" value="4096" />
    </feature>
    <feature name="SOFT TEXTURE CACHE MEMORY TIMEOUT" group="ADVANCED OPTIONS" value="xenia_limit_soft_lifetime" description="Seconds a texture should be unused to be considered old enough to be deleted if texture memory usage exceeds Soft Texture Cache limit.">
      <choice name="15s" value="15" />
      <choice name="30s (Default)" value="30" />
      <choice name="45s" value="45" />
      <choice name="60s" value="60" />
    </feature>
    <feature name="MOUNT CACHE" group="ADVANCED OPTIONS" value="xenia_cache" description="Enable cache mount. Can improve performance and compatibility in some games.">
      <choice name="Disabled" value="False" />
      <choice name="Enabled (Default)" value="True" />
    </feature>
    <feature name="KINECT" group="KINECT" value="xenia_edge_kinect" description="Let the game use a Kinect for Xbox 360 (model 1414) plugged into this machine.">
      <choice name="Disabled" value="False" />
      <choice name="Enabled" value="True" />
    </feature>
    <feature name="XBOX AVATARS" group="KINECT" value="xenia_edge_avatars" description="Let the game use Xbox avatars. Kinect Sports and Kinect Adventures need it.">
      <choice name="Disabled" value="False" />
      <choice name="Enabled" value="True" />
    </feature>
  </emulator>
</features>
