<?xml version="1.0" encoding="UTF-8" ?>
<!--
  EmulationStation's per-game advanced options for the native Xenia Edge build
  (the "xenia-edge" emulator of the xbox360 system). Batocera reads it from
  /userdata/system/configs/emulationstation/. xeniaEdgeGenerator.py turns each
  option that's set into a Xenia Edge setting on the command line; unset ones
  leave Xenia's own config files in charge. Options that mean the same here as
  for xenia-canary keep its names, so values set for one apply to the other.
-->
<features>
  <emulator name="xenia-edge" features="">
    <sharedFeature value="powermode" />
    <sharedFeature value="tdp" />
    <sharedFeature value="videomode" />
    <feature name="XBOX LIVE ARCADE" value="xenia_license" description="This option enables the ability to play Xbox Live Arcade games. May cause compatibility issues with non-XBLA games.">
      <choice name="No licenses enabled" value="0" />
      <choice name="XBLA license enabled (Default)" value="1" />
      <choice name="All possible licenses (Not recommended)" value="-1" />
    </feature>
    <feature name="INTERNAL DISPLAY RESOLUTION" value="xenia_resolution" description="Allow game that support different resolutions to be rendered in specific resolution.">
      <choice name="640x480" value="0" />
      <choice name="640x576" value="1" />
      <choice name="720x480" value="2" />
      <choice name="720x576" value="3" />
      <choice name="800x600" value="4" />
      <choice name="848x480" value="5" />
      <choice name="1024x768" value="6" />
      <choice name="1152x864" value="7" />
      <choice name="1280x720 (Default)" value="8" />
      <choice name="1280x768" value="9" />
      <choice name="1280x960" value="10" />
      <choice name="1280x1024" value="11" />
      <choice name="1360x768" value="12" />
      <choice name="1440x900" value="13" />
      <choice name="1680x1050" value="14" />
      <choice name="1920x540" value="15" />
      <choice name="1920x1080" value="16" />
    </feature>
    <feature name="RESOLUTION SCALE" value="xenia_edge_resolution_scale" description="Render at a multiple of the game's resolution. Sharper, but heavier on the GPU, and some games show seams.">
      <choice name="1x (Default)" value="1" />
      <choice name="2x" value="2" />
      <choice name="3x" value="3" />
    </feature>
    <feature name="SCALING AND SHARPENING" value="xenia_edge_scaling" description="How the picture is scaled to the screen. CAS sharpens; FSR upscales and sharpens.">
      <choice name="Bilinear (Default)" value="bilinear" />
      <choice name="AMD FidelityFX CAS" value="cas" />
      <choice name="AMD FidelityFX FSR" value="fsr" />
    </feature>
    <feature name="ANTI-ALIASING" value="xenia_edge_antialiasing" description="Post-process anti-aliasing of the game's picture. Recommended with CAS or FSR.">
      <choice name="None (Default)" value="none" />
      <choice name="FXAA" value="fxaa" />
      <choice name="FXAA Extreme" value="fxaa_extreme" />
    </feature>
    <feature name="FRAME RATE LIMIT" value="xenia_vsync_fps" description="Limit how often frames are shown. The game's own timing isn't affected.">
      <choice name="Unlimited (Default)" value="0" />
      <choice name="30fps" value="30" />
      <choice name="50fps" value="50" />
      <choice name="60fps" value="60" />
      <choice name="120fps" value="120" />
      <choice name="144fps" value="144" />
    </feature>
    <feature name="MANGOHUD" value="xenia_edge_mangohud" description="Show the MangoHud overlay with frame rate and performance stats. AUTO follows Use MangoHud in Xenia Edge's own settings.">
      <choice name="Disabled" value="False" />
      <choice name="Enabled" value="True" />
    </feature>
    <feature name="SHOW ACHIEVEMENT MESSAGES" value="xenia_achievement" description="Choose to display achievement messages in the UI.">
      <choice name="Disabled" value="False" />
      <choice name="Enabled" value="True" />
    </feature>
    <feature name="CONSOLE COUNTRY" value="xenia_country" description="Change the consoles country from the default of the United States.">
      <choice name="United Arab Emirates" value="1" />
      <choice name="Albania" value="2" />
      <choice name="Armenia" value="3" />
