<?xml version="1.0"?>
<!--
  Batocera's xbox360 system, with the native Xenia Edge build added as the
  "xenia-edge" emulator. EmulationStation reads this from
  /userdata/system/configs/emulationstation/ in place of the stock definition.
  The command runs emulatorlauncher-edge, which hands every emulator but
  xenia-edge to Batocera's own launcher unchanged.
-->
<systemList>
  <system>
        <fullname>Xbox 360</fullname>
        <name>xbox360</name>
        <manufacturer>Microsoft</manufacturer>
        <release>2005</release>
        <hardware>console</hardware>
        <path>/userdata/roms/xbox360</path>
        <extension>.iso .xex .xbox360 .zar</extension>
        <command>/userdata/system/xenia-edge/emulatorlauncher-edge %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>xbox360</platform>
        <theme>xbox360</theme>
        <emulators>
            <emulator name="xenia">
                <cores>
                    <core incompatible_extensions=".zar">xenia</core>
                </cores>
            </emulator>
            <emulator name="xenia-canary">
                <cores>
                    <core default="true">xenia-canary</core>
                </cores>
            </emulator>
            <emulator name="xenia-edge">
                <cores>
                    <core>xenia-edge</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>
